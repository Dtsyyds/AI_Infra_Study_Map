name: AI Infra Study Map CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  month01:
    name: Month01 Agent Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: month01_agent_loop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month01_agent_loop/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff static analysis
        run: python -m ruff check .

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run deterministic stability evaluation
        env:
          LLM_MODE: fake
        run: python eval_stability.py

  month02:
    name: Month02 RAG Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            month01_agent_loop/requirements-dev.txt
            month02_rag_agent/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r month01_agent_loop/requirements-dev.txt
          python -m pip install -r month02_rag_agent/requirements.txt

      - name: Run Ruff static analysis
        run: python -m ruff check month02_rag_agent

      - name: Check Python syntax
        run: python -m compileall -q month02_rag_agent

      - name: Run unit and CLI smoke tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q month02_rag_agent/tests

  month04:
    name: Month04 Agent Service
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            month04_deploy/requirements.txt
            month04_deploy/requirements-dev.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r month04_deploy/requirements.txt -r month04_deploy/requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q month04_deploy/app month04_deploy/tests

      - name: Run service tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p test-reports

          python -m pytest \
            -p pytest_asyncio.plugin \
            -q month04_deploy/tests \
            --ignore=month04_deploy/tests/test_durable_worker_integration.py \
            --junitxml=test-reports/month04.xml \
            2>&1 | tee test-reports/month04.log

      - name: Upload service test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: month04-test-reports
          path: |
            test-reports/month04.xml
            test-reports/month04.log
          if-no-files-found: warn
          retention-days: 7

  month04_db:
    name: Month04 Durable Recovery Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      AGENT_RUN_DB_TESTS: "1"
      AGENT_DATABASE_URL: postgresql://agent:agent_ci_password@127.0.0.1:15432/agent_runtime_test

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_ci_password
          POSTGRES_DB: agent_runtime_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            month04_deploy/requirements.txt
            month04_deploy/requirements-dev.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r month04_deploy/requirements.txt \
            -r month04_deploy/requirements-dev.txt

      - name: Apply database migrations
        run: |
          set -euo pipefail

          cat \
            month04_deploy/migrations/001_create_tasks.sql \
            month04_deploy/migrations/002_create_task_steps.sql |
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -X \
                -U agent \
                -d agent_runtime_test \
                --set=ON_ERROR_STOP=1 \
                --single-transaction \
                --file=-

      - name: Run durable recovery integration tests
        run: |
          set -euo pipefail
          mkdir -p test-reports

          python -m pytest \
            -p pytest_asyncio.plugin \
            -q -s \
            month04_deploy/tests/test_durable_worker_integration.py \
            --junitxml=test-reports/month04-db.xml \
            2>&1 | tee test-reports/month04-db.log

      - name: Verify integration tests actually ran
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("test-reports/month04-db.xml")
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))

          if len(cases) < 3:
              raise SystemExit("数据库集成测试少于 3 项")

          rejected = [
              case.get("name", "<unknown>")
              for case in cases
              if any(
                  case.find(tag) is not None
                  for tag in ("skipped", "failure", "error")
              )
          ]

          if rejected:
              raise SystemExit(
                  f"数据库集成测试存在跳过或失败：{rejected}"
              )

          print(
              f"Integration gate: {len(cases)} passed, "
              "0 skipped, 0 failed"
          )
          PY

      - name: Upload database test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: month04-db-test-reports
          path: |
            test-reports/month04-db.xml
            test-reports/month04-db.log
          if-no-files-found: warn
          retention-days: 7
