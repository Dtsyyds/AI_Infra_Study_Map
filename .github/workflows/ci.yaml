name: AI Infra Study Map CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  month01:
    name: Month01 Agent Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: month01_agent_loop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month01_agent_loop/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff static analysis
        run: python -m ruff check .

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run deterministic stability evaluation
        env:
          LLM_MODE: fake
        run: python eval_stability.py

  month02:
    name: Month02 RAG Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: month01_agent_loop/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r month01_agent_loop/requirements-dev.txt

      - name: Run Ruff static analysis
        run: python -m ruff check month02_rag_agent

      - name: Check Python syntax
        run: python -m compileall -q month02_rag_agent

      - name: Run unit and CLI smoke tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q month02_rag_agent/tests
