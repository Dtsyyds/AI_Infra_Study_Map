# 本轮未启动：Docker socket 无权限。实际运行的是工作区专用 PostgreSQL 17.11。
# 启动本服务前先停止占用 127.0.0.1:55439 的本项目本地 PostgreSQL。
name: arc-reference
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    container_name: arc-ref-postgres
    labels:
      io.agent-runtime-core-reference.project: reference
      io.agent-runtime-core-reference.resource: postgres
    environment:
      POSTGRES_USER: arc_ref
      POSTGRES_DB: arc_reference
      POSTGRES_PASSWORD: ${ARC_POSTGRES_PASSWORD:?Set an independent local demo password}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - arc_ref_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc_ref -d arc_reference"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: "no"
volumes:
  arc_ref_pgdata:
    name: arc_ref_pgdata
    labels:
      io.agent-runtime-core-reference.project: reference
      io.agent-runtime-core-reference.resource: postgres-data
